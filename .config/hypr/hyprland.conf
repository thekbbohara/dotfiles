# ==============================================================================
# HYPRLAND CONFIGURATION - CATPPUCCIN MOCHA THEME
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. MONITORS
# ------------------------------------------------------------------------------
# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=,preferred,auto,1

# ------------------------------------------------------------------------------
# 2. AUTOSTART
# ------------------------------------------------------------------------------
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = waybar
exec-once = swaync
exec-once = hyprpaper
exec-once = clipse --listen

# ------------------------------------------------------------------------------
# 3. ENVIRONMENT VARIABLES (NVIDIA HYBRID + WAYLAND)
# ------------------------------------------------------------------------------
# See https://wiki.hyprland.org/Nvidia/
env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland

# NVIDIA GPU Environment Variables
env = LIBVA_DRIVER_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# Cursor settings
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# ------------------------------------------------------------------------------
# 4. LOOK AND FEEL (CATPPUCCIN MOCHA)
# ------------------------------------------------------------------------------
# Catppuccin Mocha Color Palette Definitions
# Rosewater: #f5e0dc | Flamingo: #f2cdcd | Pink: #f5c2e7 | Mauve: #cba6f7
# Red: #f38ba8       | Maroon: #eba0ac   | Peach: #fab387| Yellow: #f9e2af
# Green: #a6e3a1     | Teal: #94e2d5     | Sapphire: #74c7ec | Blue: #89b4fa
# Lavender: #b4befe  | Text: #cdd6f4     | Base: #1e1e2e | Mantle: #181825

general {
    gaps_in = 6
    gaps_out = 2
    border_size = 1

    # Active border: Mauve to Blue gradient
    col.active_border = rgba(cba6f7ee) rgba(89b4faee) 45deg
    col.inactive_border = rgba(313244aa)

    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 0
    active_opacity = 1.0
    inactive_opacity = 0.92

    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1
        new_optimizations = true
        ignore_opacity = true
        vibrancy = 0.1696
    }
}

animations {
    enabled = true

    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear, 0, 0, 1, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1
    bezier = quick, 0.15, 0, 0.1, 1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = workspaces, 1, 2.5, easeOutQuint, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    disable_autoreload = false
}

# WallRizz dynamically sets window border/group colours here.
source = ~/.config/hypr/WallRizzTheme.conf

# ------------------------------------------------------------------------------
# 5. INPUT & GESTURES
# ------------------------------------------------------------------------------
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        scroll_factor = 1.0
    }
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
}

# ------------------------------------------------------------------------------
# 6. KEYBINDINGS
# ------------------------------------------------------------------------------
$mainMod = SUPER

# Applications
bind = $mainMod, Q, exec, kitty
bind = $mainMod, C, killactive,
bind = $mainMod, E, exec, dolphin || thunar || kitty -e yazi
bind = $mainMod, R, exec, wofi --show drun
bind = $mainMod SHIFT, R, exec, hyprctl reload
bind = $mainMod, V, exec, kitty --class clipse -e clipse
bind = $mainMod SHIFT, V, togglefloating,
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, fullscreen, 1
bind = $mainMod, N, exec, swaync-client -t -sw

# Quick Settings popup (Super+Escape)
bind = $mainMod, Escape, exec, quicksettings

# Focus movement
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Move active window
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Volume & Multimedia Keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# ------------------------------------------------------------------------------
# 7. WINDOW & LAYER RULES
# ------------------------------------------------------------------------------
windowrulev2 = suppressevent maximize, class:.*
windowrulev2 = float, class:^(wofi)$
windowrulev2 = stayfocused, class:^(wofi)$
windowrulev2 = float, class:^(clipse)$
windowrulev2 = size 622 652, class:^(clipse)$
windowrulev2 = center, class:^(clipse)$
